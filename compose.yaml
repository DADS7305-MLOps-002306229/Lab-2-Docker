services:
  app:
    image: ${IMAGE:?Set IMAGE in .env to the published GHCR image}
    user: "10001:10001"
    ports:
      - "127.0.0.1:${PORT:-8000}:${PORT:-8000}"
    environment:
      PORT: ${PORT:-8000}
      PROGRESS_DB: /data/progress.sqlite3
      TZ: ${TZ:-America/New_York}
    volumes:
      - progress-data:/data
    restart: unless-stopped
    init: true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:' + os.environ.get('PORT', '8000') + '/', timeout=3).close()"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  progress-data:
